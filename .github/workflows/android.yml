name: Android Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Show Project Files
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== APP ==="
          ls -la app || true

          echo "=== GRADLE FILES ==="
          find . -maxdepth 2 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-file-manager-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-file-manager-release
          path: app/build/outputs/apk/release/*.apk
